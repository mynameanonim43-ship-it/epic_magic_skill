modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional Soft Dependency: Epic Fight
[[dependencies.${mod_id}]]
    modId="epicfight"
    mandatory=false
    versionRange="[20.0,)"
    ordering="AFTER"
    side="BOTH"

# Optional Soft Dependency: Iron's Spells 'n Spellbooks
[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=false
    versionRange="[1.20.1-3.0.0,)"
    ordering="AFTER"
    side="BOTH"
